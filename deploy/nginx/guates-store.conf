# Snippet for /etc/nginx/sites-available/guatescoffeeroasters.co, inside the existing
# `listen 443 ssl` server block. Replace the `root`, `index` and `location / { try_files ... }`
# lines with this; leave every TLS line and the port-80 block untouched.
# 8710 is the proposed port: confirm it is free with `ss -ltn` and match PORT in store.env.

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
