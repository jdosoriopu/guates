<!doctype html>
<html lang="es">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><script>document.documentElement.setAttribute("data-theme", location.hash === "#dark" ? "dark" : "light");</script><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../components/bundle.js"></script><meta charset="utf-8"><title>Pattern</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); padding: var(--space-4); }
  .cell { display: grid; gap: var(--space-2); }
  .cell small { font: 500 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var G = window.Guates, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' }, G.patterns.map(function (name) {
      return h('div', { key: name, className: 'cell' }, h(G.Pattern, { name: name, height: 160 }), h('small', null, name));
    })));
</script>
</body>
</html>
