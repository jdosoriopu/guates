<!-- @dsCard group="Brand" height=470 subtitle="Ten single-ink drawings; any palette colour; optional sticker" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Illustration</title>
<style>
  .grid.g-block { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-2) var(--space-4); padding: var(--space-4) var(--space-6); }
  .cell { display: grid; justify-items: center; gap: var(--space-1); }
  .cell small { font: 400 12px/16px var(--font-sans); }
  .stickers { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: center; padding: var(--space-4) var(--space-8); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var G = window.Guates, h = React.createElement;
  var inks = { perezoso: 'verde-moriche', mono: 'naranja-tostion', chiguiro: 'cereza-profunda', colibri: 'verde-moriche', erizo: 'azul-exploracion', garza: 'cafe-de-origen', nutria: 'verde-moriche', pajaro: 'naranja-tostion', cafetera: 'azul-exploracion', granos: 'cafe-de-origen' };
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(G.ColorBlock, { tone: 'crema-de-papel', className: 'grid' }, G.illustrations.map(function (it) {
      return h('div', { key: it.name, className: 'cell' }, h(G.Illustration, { name: it.name, color: inks[it.name], size: 112, title: it.label }), h('small', null, it.name));
    })),
    h(G.ColorBlock, { tone: 'cafe-de-origen', className: 'stickers' },
      h(G.Illustration, { name: 'mono', color: 'naranja-tostion', sticker: 'crema-de-papel', size: 128 }),
      h(G.Illustration, { name: 'chiguiro', color: 'verde-moriche', sticker: 'luz-de-manana', size: 128 }),
      h(G.Illustration, { name: 'colibri', color: 'naranja-tostion', sticker: 'rosa-floracion', size: 128 }),
      h(G.Illustration, { name: 'erizo', color: 'crema-de-papel', sticker: 'atardecer-llanero', size: 128 }))));
</script>
</body>
</html>
