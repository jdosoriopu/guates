<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div id="root" class="g-row"></div>
<script>
  var G = window.Guates, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(G.Button, { size: 'lg' }, 'Suscribirme'),
    h(G.Button, null, 'Agregar al carrito'),
    h(G.Button, { variant: 'secondary' }, 'Ver ficha de origen'),
    h(G.Button, { variant: 'secondary', disabled: true }, 'Agotado')));
</script>
</body>
</html>
