<!-- @dsCard group="Brand" height=330 subtitle="Principal, secundario, alternativo and approved colour pairs" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Logo</title>
<style>
  .lockups.g-block { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-6); padding: var(--space-6) var(--space-6) var(--space-4); }
  .lockup { display: grid; gap: var(--space-2); justify-items: start; }
  .lockup small { font: 500 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; }
  .clear { outline: 1px dashed currentColor; }
  .pairs { display: grid; grid-template-columns: repeat(6, 1fr); }
  .pairs > div { display: grid; place-items: center; height: 96px; padding: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var G = window.Guates, h = React.createElement;
  var pairs = [['azul-exploracion', 'rosa-floracion'], ['verde-brote', 'verde-moriche'], ['cafe-de-origen', 'cielo-abierto'], ['atardecer-llanero', 'luz-de-manana'], ['naranja-tostion', 'crema-de-papel'], ['sol-de-sabana', 'cereza-profunda']];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(G.ColorBlock, { tone: 'crema-de-papel', className: 'lockups' },
      h('div', { className: 'lockup' }, h(G.Logo, { version: 'principal', color: 'cereza-profunda', height: 120 }), h('small', null, 'Principal')),
      h('div', { className: 'lockup' }, h(G.Logo, { version: 'secundario', color: 'atardecer-llanero', height: 120 }), h('small', null, 'Secundario')),
      h('div', { className: 'lockup' }, h(G.Logo, { version: 'alternativo', color: 'azul-exploracion', height: 48, clearSpace: true, className: 'clear' }), h('small', null, 'Alternativo · clear space ¼ G'))),
    h('div', { className: 'pairs' }, pairs.map(function (p) {
      return h(G.ColorBlock, { key: p[0], tone: p[0] }, h(G.Logo, { version: 'alternativo', color: p[1], height: 36 }));
    }))));
</script>
</body>
</html>
