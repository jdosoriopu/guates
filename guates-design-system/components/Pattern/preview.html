<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Pattern</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); padding: var(--space-4); }
  .cell { display: grid; gap: var(--space-2); }
  .cell small { font: 500 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var G = window.Guates, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' }, G.patterns.map(function (name) {
      return h('div', { key: name, className: 'cell' }, h(G.Pattern, { name: name, height: 160 }), h('small', null, name));
    })));
</script>
</body>
</html>
