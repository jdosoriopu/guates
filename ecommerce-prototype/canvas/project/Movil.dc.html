<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Guates tienda en el móvil</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/guates/components/bundle.css">
<script src="ds/guates/components/bundle.js"></script>
<script src="/_blob/e70c4327e7796a073094a6659ef263c6"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&amp;family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&amp;family=Roboto+Slab:wght@200..900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow-x: hidden; overflow-y: auto; background: #F6F3ED; color: #624532; font-family: Roboto, 'Helvetica Neue', Arial, sans-serif">
<dc-import name="Main" start-screen="{{screen}}" start-product="{{product}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["home","catalogo","producto","carrito","suscripcion"],"default":"producto"},"product":{"editor":"enum","options":["regional","lavado","natural","honey","platea"],"default":"honey"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { screen: this.props.screen ?? 'producto', product: this.props.product ?? 'honey' };
  }
}
</script>
</body>
</html>
